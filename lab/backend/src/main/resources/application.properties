# Supabase/Postgres connection - all values come from environment variables.
# NEVER hard-code real credentials here or commit a filled-in .env file.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The lab pre-creates tables via sql/schema.sql, so Hibernate should only
# validate the mapping matches, never auto-generate/alter the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

# Allowed origin for the React dev server (CORS). Override via env var if needed.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
