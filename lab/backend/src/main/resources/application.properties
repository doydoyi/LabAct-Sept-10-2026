# Supabase/Postgres connection - all values come from environment variables.
# NEVER hard-code real credentials here or commit a filled-in .env file.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# The lab pre-creates tables via sql/schema.sql, so Hibernate should only
# validate the mapping matches, never auto-generate/alter the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

# Allowed origin for the React dev server (CORS). Override via env var if needed.
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# A successful reserve() that leaves a product's stock below this number
# triggers a LowStockEvent, picked up by the Notification module.
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

# LegacySupply connection
app.supplier.base-url=${LS_BASE_URL:https://legacysupply.onrender.com/api/v1}
app.supplier.api-key=${LS_API_KEY}
app.supplier.client-id=${LS_CLIENT_ID}

# Business tuning
app.supplier.reorder-target-level=${SUPPLIER_REORDER_TARGET:20}
# Lab 4: deliveries are checked every 15s so backorders resolve soon after a
# delivery lands (was 120s in Lab 3).
app.supplier.poll-interval-ms=${SUPPLIER_POLL_INTERVAL_MS:15000}
app.supplier.retry-interval-ms=${SUPPLIER_RETRY_INTERVAL_MS:30000}

# Catalog mapping - FILL THESE IN AFTER RUNNING probe.sh (step 5 below).
# These three products are your current Lab 2 seed data (see schema.sql).
app.supplier.catalog.P100.sku=BTK-1241
app.supplier.catalog.P100.pack-size=6
app.supplier.catalog.P200.sku=BTK-7342
app.supplier.catalog.P200.pack-size=10
app.supplier.catalog.P300.sku=BTK-7074
app.supplier.catalog.P300.pack-size=12
	
# Background jobs (supplier polling/retry) get their own threads instead of
# sharing Spring's default single scheduler thread.
spring.task.scheduling.pool.size=4

# Lab 4 - Tiangge marketplace channel (edu.cit.alvarado.channel).
# Same student ID and API key as LegacySupply - from environment variables
# only, never committed.
app.tiangge.base-url=${TIANGGE_BASE_URL:https://legacysupply.onrender.com/tiangge/v1}
app.tiangge.client-id=${LS_CLIENT_ID}
app.tiangge.api-key=${LS_API_KEY}
app.tiangge.app-name=${TIANGGE_APP_NAME:alvarado-shop}
app.tiangge.feed-poll-ms=${TIANGGE_FEED_POLL_MS:3000}
app.tiangge.feed-batch-size=50
app.tiangge.backorder-max-wait-seconds=${TIANGGE_BACKORDER_MAX_WAIT_SECONDS:900}
